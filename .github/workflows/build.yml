name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Descompactar projeto
        run: |
          unzip -o GameBooster-Android-Project.zip -d project

      - name: Encontrar gradlew
        run: |
          find project -name gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao Gradle
        run: chmod +x $(find project -name gradlew | head -1)

      - name: Compilar APK
        run: |
          cd $(dirname $(find project -name gradlew | head -1))
          ./gradlew assembleDebug

      - name: Encontrar APK
        run: find project -name "*.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: project/**/app/build/outputs/apk/debug/*.apk
